<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Wide curved brim (back/under-rim shadow) -->
  <ellipse cx="50" cy="80" rx="43" ry="12" fill="#4C1D95" />
  <!-- Wide curved brim (main top surface) -->
  <path
    d="M8 78C8 71 26 66 50 66C74 66 92 71 92 78C92 84 74 87 50 87C26 87 8 84 8 78Z"
    fill="#6D28D9"
  />
  <!-- Subtle brim highlight -->
  <path
    d="M13 77C17 72 32 69 50 69C68 69 83 72 87 77"
    stroke="#8B5CF6"
    stroke-width="2.5"
    stroke-linecap="round"
  />

  <!-- Tall pointed cone with a whimsical bend to the right -->
  <path
    d="M26 71C28 51 35 31 48 16C54 9 63 6 70 9C75 11 76 16 71 19C65 22 61 28 62 36C64 49 70 60 74 71Z"
    fill="#5B21B6"
  />
