  <path
    d="M29 70C31 51 38 32 50 18C55 12 62 9 68 10C60 12 53 19 48 29C42 42 38 56 36 70Z"
    fill="#7C3AED"
  />

  <!-- Golden band wrapping the base of the cone -->
