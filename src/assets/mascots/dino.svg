<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <radialGradient id="dino-skin" cx="50%" cy="38%" r="58%">
      <stop offset="0%" stop-color="#4ADE80" />
      <stop offset="65%" stop-color="#22C55E" />
      <stop offset="100%" stop-color="#15803D" />
    </radialGradient>
    <radialGradient id="dino-snout" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#ECFCCB" />
      <stop offset="65%" stop-color="#BBF7D0" />
      <stop offset="100%" stop-color="#86EFAC" />
    </radialGradient>
    <linearGradient id="dino-crest" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="100%" stop-color="#84CC16" />
    </linearGradient>
  </defs>

  <!-- Rounded Top Crest Spikes -->
  <path
    d="M32 23C29 14 33 9 38 11C41 13 43 17 44 21Z"
    fill="url(#dino-crest)"
  />
  <path
    d="M44 20C44 10 47 6 50 6C53 6 56 10 56 20Z"
