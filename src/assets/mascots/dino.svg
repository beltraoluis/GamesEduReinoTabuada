  <!-- Cute Cheek Blushes -->
  <ellipse cx="26" cy="64" rx="5.5" ry="3.5" fill="#FDA4AF" opacity="0.6" />
  <ellipse cx="74" cy="64" rx="5.5" ry="3.5" fill="#FDA4AF" opacity="0.6" />

  <!-- Friendly Brow Ridges -->
  <path d="M27 33C31 30.5 36 30.5 40 33" stroke="#15803D" stroke-width="2.6" stroke-linecap="round" />
  <path d="M60 33C64 30.5 69 30.5 73 33" stroke="#15803D" stroke-width="2.6" stroke-linecap="round" />

  <!-- Big Friendly Shiny Eyes -->
  <ellipse cx="34.5" cy="42.5" rx="6.8" ry="7.6" fill="#052E16" />
  <circle cx="32.3" cy="39.8" r="2.5" fill="#FFFFFF" />
  <circle cx="36.8" cy="45" r="1.1" fill="#FFFFFF" opacity="0.85" />

  <ellipse cx="65.5" cy="42.5" rx="6.8" ry="7.6" fill="#052E16" />
  <circle cx="63.3" cy="39.8" r="2.5" fill="#FFFFFF" />
  <circle cx="67.8" cy="45" r="1.1" fill="#FFFFFF" opacity="0.85" />

  <!-- Cute Snout Nostrils -->
  <ellipse cx="43.5" cy="55.5" rx="2.2" ry="2.8" transform="rotate(-12 43.5 55.5)" fill="#166534" />
  <ellipse cx="56.5" cy="55.5" rx="2.2" ry="2.8" transform="rotate(12 56.5 55.5)" fill="#166534" />

