  />
  <path
    d="M56 21C57 17 59 13 62 11C67 9 71 14 68 23Z"
    fill="url(#dino-crest)"
  />

  <!-- Main Round Dino/Dragon Head -->
  <path
    d="M50 18C69 18 82 29 84 46C88 53 89 64 83 73C76 83 64 88 50 88C36 88 24 83 17 73C11 64 12 53 16 46C18 29 31 18 50 18Z"
    fill="url(#dino-skin)"
  />

  <!-- Soft Forehead Highlight -->
  <ellipse cx="50" cy="29" rx="17" ry="7" fill="#86EFAC" opacity="0.35" />

  <!-- Lighter Belly-Green Snout -->
  <path
    d="M50 48C64 48 79 54 81 66C82 77 69 87 50 87C31 87 18 77 19 66C21 54 36 48 50 48Z"
